name: one-shot-security-lockfile
on:
  workflow_dispatch:
  push:
    branches:
      - "chore/security-overrides-*"
permissions:
  contents: write
  pull-requests: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install and refresh lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then echo "No lockfile changes"; exit 0; fi
          git commit -m "chore(security): regenerate lockfile from overrides"
          git push
